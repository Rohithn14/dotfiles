# ──────────────────────────────────────────────────────────────
#  General
# ──────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g focus-events on
set -g history-limit 50000
set -g display-time 2000
set -g status-interval 5
set -sg escape-time 0          # no delay after ESC in vim
set -g set-clipboard on

# Mouse
set -g mouse on

# Start windows and panes at 1 (easier keyboard reach)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# ──────────────────────────────────────────────────────────────
#  Prefix
# ──────────────────────────────────────────────────────────────
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# ──────────────────────────────────────────────────────────────
#  Reload config
# ──────────────────────────────────────────────────────────────
unbind r
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ──────────────────────────────────────────────────────────────
#  Windows & Panes
# ──────────────────────────────────────────────────────────────
# Open splits in same directory
bind-key "|" split-window -h -c "#{pane_current_path}"
bind-key "\\" split-window -fh -c "#{pane_current_path}"
bind-key "-" split-window -v -c "#{pane_current_path}"
bind-key "_" split-window -fv -c "#{pane_current_path}"
unbind '"'
unbind %

# Alt+keys (no prefix) for splits
bind -n M-v split-window -h -c "#{pane_current_path}"
bind -n M-g split-window -v -c "#{pane_current_path}"

# Pane navigation (vim-aware)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'M-h' if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind-key -n 'M-j' if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind-key -n 'M-k' if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind-key -n 'M-l' if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'

# Pane resize with prefix + arrow keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Swap panes
bind > swap-pane -D
bind < swap-pane -U

# Window navigation
bind -n M-n next-window
bind -n M-p previous-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# New window in same directory
bind c new-window -c "#{pane_current_path}"

# Swap windows
bind-key -n C-S-Left swap-window -t -1 \; select-window -t -1
bind-key -n C-S-Right swap-window -t +1 \; select-window -t +1

# Break pane into window / join
bind-key b break-pane -d
bind-key B join-pane -t :

# Zoom toggle
bind -n M-z resize-pane -Z

# ──────────────────────────────────────────────────────────────
#  Copy mode (vi)
# ──────────────────────────────────────────────────────────────
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y   send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi H   send-keys -X start-of-line
bind-key -T copy-mode-vi L   send-keys -X end-of-line

# Enter copy mode easily
bind Escape copy-mode
bind -n M-[ copy-mode
bind P paste-buffer

# ──────────────────────────────────────────────────────────────
#  Sessions
# ──────────────────────────────────────────────────────────────
bind S choose-session
bind N new-session
bind X confirm-before -p "Kill session #S? (y/n)" kill-session
bind Q confirm-before -p "Kill ALL sessions? (y/n)" kill-server

# ──────────────────────────────────────────────────────────────
#  Misc quality-of-life
# ──────────────────────────────────────────────────────────────
# Synchronize panes toggle
bind e set-window-option synchronize-panes \; \
    display "synchronize-panes #{?pane_synchronized,ON,OFF}"

# Clear screen + history
bind C-l send-keys 'C-l' \; run 'sleep 0.1' \; clear-history

# Open a floating scratch popup terminal
bind -n M-t popup -d "#{pane_current_path}" -xC -yC -w 80% -h 75% \
    -E "tmux new-session -A -s scratch"

# Open lazygit in a popup
bind -n M-G popup -d "#{pane_current_path}" -xC -yC -w 95% -h 90% \
    -E "lazygit"

# ──────────────────────────────────────────────────────────────
#  Status bar position
# ──────────────────────────────────────────────────────────────
set -g status-position top

# ──────────────────────────────────────────────────────────────
#  Plugins
# ──────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Catppuccin theme (Mocha)
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_status_modules_right "directory session date_time"
set -g @catppuccin_status_modules_left ""
set -g @catppuccin_date_time_text "%H:%M"
set -g @catppuccin_directory_text "#{b:pane_current_path}"
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_fill "icon"

# Session persistence (survive reboots)
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# Fuzzy-find URLs/paths in pane output and open them
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @fzf-url-bind 'u'

# Smarter yank (copies to system clipboard)
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_action 'copy-pipe-no-clear'

# Better session/window/pane switcher with fzf
set -g @plugin 'sainnhe/tmux-fzf'
TMUX_FZF_LAUNCH_KEY="f"
TMUX_FZF_ORDER="session|window|pane|command|keybinding"

# Highlight when prefix is active
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr 'fg=black,bg=yellow'
set -g @prefix_highlight_prefix_prompt 'PREFIX'
set -g @prefix_highlight_copy_prompt 'COPY'

# ──────────────────────────────────────────────────────────────
#  Initialize TPM (keep at very bottom)
# ──────────────────────────────────────────────────────────────
run '~/.tmux/plugins/tpm/tpm'
